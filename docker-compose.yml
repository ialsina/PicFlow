services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PICFLOW_ALLOWED_ROOTS: /data/images
      PICFLOW_CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
      - ${PICFLOW_IMAGE_MOUNT:-./sample-images}:/data/images:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
